<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Draw – Prize Details</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow+Condensed:wght@700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:    #FFC107;
  --gold-lt: #FFE082;
  --gold-dk: #FF8F00;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Nunito', sans-serif;
  background: #061A4A;
}

/* ── HERO ── */
.hero {
  position: relative;
  width: 100vw; height: 100vh;
  display: flex; flex-direction: column;
  overflow: hidden;
}

.hero-bg {
  position: absolute; inset: 0; z-index: 0;
  background: radial-gradient(ellipse 110% 90% at 50% 25%,
    #4FC3F7 0%, #145FD3 28%, #0B3C8A 58%, #061A4A 100%);
}
.hero-bg::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 42%, rgba(4,12,40,0.55) 72%, rgba(4,12,40,0.82) 100%);
}

.rays { position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
.rays::before {
  content: ''; position: absolute;
  top: 22%; left: 50%; width: 250%; height: 250%;
  transform: translate(-50%,-50%);
  background: conic-gradient(
    from 0deg,
    transparent 0deg, rgba(255,255,255,0.11) 4deg, transparent 8deg,
    transparent 22deg, rgba(255,255,255,0.08) 26deg, transparent 30deg,
    transparent 44deg, rgba(255,255,255,0.11) 48deg, transparent 52deg,
    transparent 66deg, rgba(255,255,255,0.08) 70deg, transparent 74deg,
    transparent 88deg, rgba(255,255,255,0.11) 92deg, transparent 96deg,
    transparent 110deg, rgba(255,255,255,0.08) 114deg, transparent 118deg,
    transparent 132deg, rgba(255,255,255,0.11) 136deg, transparent 140deg,
    transparent 154deg, rgba(255,255,255,0.08) 158deg, transparent 162deg,
    transparent 176deg, rgba(255,255,255,0.11) 180deg, transparent 184deg,
    transparent 198deg, rgba(255,255,255,0.08) 202deg, transparent 206deg,
    transparent 220deg, rgba(255,255,255,0.11) 224deg, transparent 228deg,
    transparent 242deg, rgba(255,255,255,0.08) 246deg, transparent 250deg,
    transparent 264deg, rgba(255,255,255,0.11) 268deg, transparent 272deg,
    transparent 286deg, rgba(255,255,255,0.08) 290deg, transparent 294deg,
    transparent 308deg, rgba(255,255,255,0.11) 312deg, transparent 316deg,
    transparent 330deg, rgba(255,255,255,0.08) 334deg, transparent 338deg,
    transparent 352deg, rgba(255,255,255,0.11) 356deg, transparent 360deg
  );
  animation: spinRays 55s linear infinite;
}
@keyframes spinRays { to { transform: translate(-50%,-50%) rotate(360deg); } }

.fx { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.cf { position: absolute; top:-20px; animation: cfFall linear infinite; opacity:0; }
@keyframes cfFall {
  0%   { transform:translateY(-30px) rotate(0deg); opacity:0; }
  8%   { opacity:1; }
  92%  { opacity:0.8; }
  100% { transform:translateY(105vh) rotate(720deg); opacity:0; }
}
.sp {
  position: absolute;
  clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  background: #FFE082;
  animation: twk ease-in-out infinite;
}
@keyframes twk {
  0%,100% { opacity:0.1; transform:scale(0.7); }
  50%      { opacity:1;   transform:scale(1.5); }
}

/* ── HOME BUTTON ── */
.home-btn {
  position: fixed; top: 16px; left: 16px;
  z-index: 200;
  display: flex; align-items: center; gap: 7px;
  background: rgba(6,18,60,0.85);
  border: 1.5px solid rgba(255,193,7,0.4);
  border-radius: 50px;
  padding: 8px 18px 8px 12px;
  color: var(--gold);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px; font-weight: 900;
  letter-spacing: 1.5px;
  text-decoration: none;
  backdrop-filter: blur(16px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  transition: all 0.22s ease;
}
.home-btn:hover {
  background: rgba(255,193,7,0.15);
  border-color: var(--gold);
  transform: translateX(-3px);
  box-shadow: 0 6px 28px rgba(255,193,7,0.3);
}
.home-btn svg { width: 16px; height: 16px; fill: var(--gold); }

/* ── MAIN CONTENT ── */
.content {
  position: relative; z-index: 10;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px 16px;
}

.logo {
  width: min(360px, 65vw);
  flex-shrink: 0;
  filter: drop-shadow(0 0 40px rgba(79,195,247,0.9)) drop-shadow(0 0 80px rgba(255,193,7,0.5));
  animation: logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse {
  0%,100% { filter: drop-shadow(0 0 40px rgba(79,195,247,0.75)) drop-shadow(0 0 80px rgba(255,193,7,0.4)); }
  50%      { filter: drop-shadow(0 0 70px rgba(79,195,247,1)) drop-shadow(0 0 130px rgba(255,193,7,0.75)); }
}

/* ── PODIUM (single prize) ── */
.podium-single {
  display: flex; flex-direction: column; align-items: center;
  position: relative; flex-shrink: 0;
}
.podium-single::after {
  content: ''; position: absolute; bottom: -4px;
  width: 110%; height: 20px; border-radius: 50%; filter: blur(12px);
  background: radial-gradient(ellipse, rgba(255,193,7,0.6) 0%, transparent 70%);
}

.p-product-wrap {
  position: relative;
  display: inline-flex; align-items: flex-end; justify-content: center;
}
.p-badge {
  position: absolute; top: -8px; left: -12px; z-index: 5;
  filter: drop-shadow(0 3px 8px rgba(0,0,0,0.55));
  animation: badgeBounce 2.5s ease-in-out infinite;
  width: clamp(42px,6vw,68px);
}
@keyframes badgeBounce {
  0%,100% { transform: rotate(-8deg) scale(1); }
  50%      { transform: rotate(-4deg) scale(1.12); }
}
.p-product {
  object-fit: contain;
  filter: drop-shadow(0 10px 24px rgba(0,0,0,0.65));
  animation: floatUp 3.5s ease-in-out infinite;
  margin-bottom: -5px;
  position: relative; z-index: 2;
  width: clamp(105px,16vw,178px);
}
@keyframes floatUp {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-12px); }
}
.p-disc {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  background: url('https://raw.githubusercontent.com/projectquicksilver/farmology-lucky-draw/main/podium.png') center/contain no-repeat;
  width: clamp(112px,16vw,182px); height: clamp(30px,5vw,58px);
}
.p-rank-label {
  position: absolute;
  font-family:'Barlow Condensed',sans-serif; font-weight:900;
  font-size:clamp(9px,1.4vw,14px);
  letter-spacing:1px; color:#5a3a00;
  white-space:nowrap; text-shadow:0 1px 0 rgba(255,255,255,0.4);
}
.p-pill {
  margin-top:6px;
  background:linear-gradient(135deg,rgba(10,28,80,0.92),rgba(6,16,55,0.96));
  border-radius:40px; padding:4px 18px; text-align:center;
  border:1.5px solid rgba(255,193,7,0.5);
}
.p-pill strong {
  display:block; font-family:'Barlow Condensed',sans-serif; font-weight:900;
  font-size:clamp(9px,1.3vw,14px); line-height:1.2; color:var(--gold);
}
.p-pill span { font-size:clamp(8px,1vw,10px); color:rgba(255,255,255,0.45); font-weight:700; }

.divider {
  display:flex; align-items:center;
  width:100%; max-width:600px;
  gap:10px; flex-shrink:0;
}
.div-line { flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(255,193,7,0.4),transparent); }
.div-txt {
  font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:900;
  letter-spacing:3px; color:rgba(255,255,255,0.35); text-transform:uppercase; white-space:nowrap;
}

/* ── CARD / WHEEL SECTION ── */
.card-zone {
  position: relative;
  width: 100%; max-width: 320px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  min-height: clamp(200px, 28vh, 280px);
}

/* ── PRIZE CARD (same style as home) ── */
.pcard-wrap {
  width: 100%; max-width: 285px;
  position:relative; border-radius:20px;
  cursor: pointer;
}
.pcard-wrap::before {
  content:''; position:absolute; inset:-2px; border-radius:21px;
  background: conic-gradient(from 0deg, #FFD700 0%, #FFE082 25%, #FF8F00 50%, #FFC107 75%, #FFD700 100%);
  opacity:0; transition:opacity 0.35s ease; z-index:0;
  animation: borderSpin 2.5s linear infinite;
}
.pcard-wrap:hover::before { opacity:1; }
@keyframes borderSpin {
  0%  { background: conic-gradient(from 0deg,   #FFD700,#FFE082,#FF8F00,#FFC107,#FFD700); }
  25% { background: conic-gradient(from 90deg,  #FFD700,#FFE082,#FF8F00,#FFC107,#FFD700); }
  50% { background: conic-gradient(from 180deg, #FFD700,#FFE082,#FF8F00,#FFC107,#FFD700); }
  75% { background: conic-gradient(from 270deg, #FFD700,#FFE082,#FF8F00,#FFC107,#FFD700); }
  100%{ background: conic-gradient(from 360deg, #FFD700,#FFE082,#FF8F00,#FFC107,#FFD700); }
}
.pcard-wrap::after {
  content:''; position:absolute; inset:-16px; border-radius:28px;
  background:radial-gradient(circle,rgba(255,193,7,0.2) 0%,transparent 70%);
  opacity:0; transition:opacity 0.35s ease; z-index:-1;
  animation:auraBreath 2.8s ease-in-out infinite;
}
.pcard-wrap:hover::after { opacity:1; }
@keyframes auraBreath {
  0%,100% { transform:scale(0.95); }
  50%      { transform:scale(1.05); }
}
.pcard {
  position:relative; z-index:1; width:100%; border-radius:18px; overflow:hidden;
  background: linear-gradient(160deg, rgba(255,255,255,0.14) 0%, rgba(79,195,247,0.06) 40%, rgba(255,193,7,0.05) 100%);
  backdrop-filter:blur(20px);
  border:1.5px solid rgba(255,220,80,0.28);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 8px 32px rgba(0,0,0,0.5), 0 0 20px rgba(255,193,7,0.07);
  transition: transform 0.32s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
}
.pcard-wrap:hover .pcard {
  transform: translateY(-10px) scale(1.035);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 22px 55px rgba(0,0,0,0.6), 0 0 55px rgba(255,193,7,0.22);
}
.pcard-spotlight {
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:75%; height:50px;
  background:radial-gradient(ellipse at 50% 0%, rgba(255,230,80,0.25) 0%, transparent 75%);
  z-index:1; pointer-events:none;
}
.pcard-medal {
  position:absolute; top:8px; left:10px; z-index:6;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,0.5));
  transition:transform 0.32s cubic-bezier(0.34,1.56,0.64,1);
  width:clamp(38px,5vw,54px);
}
.pcard-wrap:hover .pcard-medal { transform:rotate(-12deg) scale(1.22); }
.pcard-body {
  padding:10px 12px 12px;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  position:relative; z-index:3;
}
.pcard-platform {
  position:relative; width:clamp(88px,11.5vw,112px); height:clamp(88px,11.5vw,112px);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.pcard-platform::before,.pcard-platform::after {
  content:''; position:absolute; border-radius:50%;
  border:1.5px solid rgba(255,193,7,0.4); animation:ringPulse 2.5s ease-in-out infinite;
}
.pcard-platform::before { inset:0; }
.pcard-platform::after  { inset:13px; animation-delay:0.55s; }
.ring3 { position:absolute; inset:25px; border-radius:50%; border:1px solid rgba(255,193,7,0.25); animation:ringPulse 2.5s ease-in-out infinite 1.1s; }
.pcard-platform-inner { position:absolute; inset:28px; border-radius:50%; background:radial-gradient(circle, rgba(255,193,7,0.22) 0%, transparent 100%); animation:innerGlow 2.5s ease-in-out infinite; }
@keyframes innerGlow { 0%,100%{opacity:0.5;transform:scale(0.94);} 50%{opacity:1;transform:scale(1.06);} }
@keyframes ringPulse  { 0%,100%{opacity:0.3;transform:scale(1);}  50%{opacity:1;transform:scale(1.07);} }
.pcard-img {
  width:clamp(72px,9.5vw,102px); height:clamp(72px,9.5vw,102px);
  object-fit:contain; filter:drop-shadow(0 6px 18px rgba(0,0,0,0.6));
  animation:floatUp 3.5s ease-in-out infinite; position:relative; z-index:4;
  transition:filter 0.3s ease, transform 0.3s ease;
}
.pcard-wrap:hover .pcard-img {
  filter:drop-shadow(0 8px 24px rgba(255,193,7,0.55)) drop-shadow(0 0 22px rgba(255,193,7,0.35));
  transform:scale(1.1) translateY(-5px);
}
.pcard-rank {
  font-family:'Barlow Condensed',sans-serif; font-size:9px; font-weight:900;
  letter-spacing:2.5px; text-transform:uppercase;
  padding:2px 9px; border-radius:20px; color:var(--gold);
  background:rgba(255,193,7,0.1); border:1px solid rgba(255,193,7,0.3);
}
.pcard-name {
  font-family:'Barlow Condensed',sans-serif; font-size:clamp(13px,1.9vw,17px);
  font-weight:900; color:#fff; text-align:center; line-height:1.15;
}
.pcard-sub { font-size:clamp(9px,1.1vw,11px); color:rgba(255,255,255,0.4); text-align:center; font-weight:700; margin-top:-3px; }
.pcard-qty {
  font-size:10px; font-weight:800; padding:2px 10px; border-radius:20px;
  color:var(--gold-lt); background:rgba(255,193,7,0.1); border:1px solid rgba(255,193,7,0.25);
}
.pcard-hint {
  width:100%; padding:9px; border-radius:10px; border:none;
  font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:900;
  letter-spacing:1.5px; text-transform:uppercase;
  background:linear-gradient(135deg,#FFD700,#FF8F00); color:#1a0800;
  box-shadow:0 4px 16px rgba(255,193,7,0.5); position:relative; overflow:hidden;
}
.pcard-hint::before {
  content:''; position:absolute; top:-50%; left:-60%; width:40%; height:200%;
  background:rgba(255,255,255,0.38); transform:skewX(-20deg);
  animation:sheen 3s ease-in-out infinite; z-index:1;
}
@keyframes sheen {
  0%,25%{left:-60%;opacity:0;} 27%{opacity:1;} 52%{left:130%;opacity:0;} 100%{left:130%;opacity:0;}
}

/* ── WHEEL OVERLAY ── */
#wheel-zone {
  display: none;
  position: absolute; inset: 0;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 14px;
  z-index: 20;
}
#wheel-zone.active { display: flex; }

.wheel-halo {
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
.wheel-halo::before {
  content: '';
  position: absolute; inset: -20px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,193,7,0.2) 0%, transparent 70%);
  animation: haloBreath 2s ease-in-out infinite; z-index: 0;
}
@keyframes haloBreath { 0%,100%{transform:scale(0.95);opacity:0.7;} 50%{transform:scale(1.08);opacity:1;} }

.wheel-container {
  position: relative;
  width: clamp(220px, 32vw, 300px);
  height: clamp(220px, 32vw, 300px);
  cursor: pointer; z-index: 1;
}
.wheel-container canvas { display: block; border-radius: 50%; }

/* Red triangle pointer — exactly like the image */
.wheel-arrow {
  position: absolute;
  top: -18px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-top: 30px solid #E63946;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
  z-index: 10;
}

/* Remove SVG arrow — not needed */
.wheel-container svg.wheel-arrow { display: none; }

.wheel-outer-ring { display: none; }

.wheel-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(12px, 1.8vw, 15px); font-weight: 900;
  color: rgba(255,255,255,0.6); letter-spacing: 3px; text-transform: uppercase;
  animation: pulse 1.5s ease-in-out infinite;
  text-shadow: 0 0 20px rgba(255,193,7,0.4);
}
@keyframes pulse { 0%,100%{opacity:0.45;} 50%{opacity:1;} }

/* ── REVEAL BUTTON WRAPPER — centered in bottom half ── */
#reveal-btn-wrap {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 50vh;
  align-items: center; justify-content: center;
  z-index: 100;
  pointer-events: none;
}
#reveal-btn-wrap.show { display: flex; }

/* ── REVEAL BUTTON ── */
#reveal-btn {
  pointer-events: all;
  display: block;
  padding: 20px 56px;
  border-radius: 60px;
  border: none;
  background: linear-gradient(135deg, #FFD700 0%, #FF8F00 40%, #FF3B3B 100%);
  color: #fff;
  font-family: 'Russo One', sans-serif;
  font-size: clamp(18px, 2.8vw, 26px);
  letter-spacing: 2px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  /* multi-layer glow */
  box-shadow:
    0 0 0 0 rgba(255,193,7,0),
    0 8px 32px rgba(255,140,0,0.55),
    0 0 60px rgba(255,193,7,0.25);
  animation:
    revealPop  0.5s cubic-bezier(0.34,1.56,0.64,1) both,
    revealGlow 2.4s ease-in-out 0.5s infinite;
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

/* Entry pop */
@keyframes revealPop {
  0%   { transform: scale(0.5) translateY(40px); opacity: 0; }
  70%  { transform: scale(1.08) translateY(-6px); opacity: 1; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}

/* Pulsing glow breathe */
@keyframes revealGlow {
  0%,100% {
    box-shadow:
      0 0 0  4px rgba(255,193,7,0.15),
      0 8px 32px rgba(255,140,0,0.55),
      0 0 60px rgba(255,193,7,0.2);
  }
  50% {
    box-shadow:
      0 0 0 14px rgba(255,193,7,0.08),
      0 12px 55px rgba(255,140,0,0.8),
      0 0 100px rgba(255,193,7,0.45);
  }
}

/* Hover: lift + supercharge glow */
#reveal-btn:hover {
  transform: translateY(-6px) scale(1.06);
  box-shadow:
    0 0 0 18px rgba(255,193,7,0.06),
    0 20px 60px rgba(255,140,0,0.9),
    0 0 120px rgba(255,193,7,0.55);
}
#reveal-btn:active { transform: scale(0.95); }

/* Rotating shine sweep */
#reveal-btn::before {
  content: '';
  position: absolute; top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(110deg, transparent 20%, rgba(255,255,255,0.45) 50%, transparent 80%);
  animation: btnSheen 2.2s ease-in-out infinite;
}
@keyframes btnSheen {
  0%,30% { left: -100%; }
  60%     { left: 130%; }
  100%    { left: 130%; }
}

/* Ring pulse rings emanating outward */
#reveal-btn::after {
  content: '';
  position: absolute; inset: -4px;
  border-radius: 64px;
  border: 2.5px solid rgba(255,193,7,0.6);
  animation: ringExpand 2.4s ease-out 0.5s infinite;
  pointer-events: none;
}
@keyframes ringExpand {
  0%   { inset: -2px;  opacity: 0.9; }
  100% { inset: -22px; opacity: 0; border-color: rgba(255,193,7,0); }
}

/* ══════════════════════════════════════════
   MODAL / CAROUSEL  — premium redesign
══════════════════════════════════════════ */
#modal-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 300;
  background: rgba(2, 8, 32, 0.92);
  backdrop-filter: blur(18px) saturate(1.4);
  align-items: center; justify-content: center;
  padding: 16px;
}
#modal-overlay.open { display: flex; }

/* Outer ambient glow behind card */
.modal-glow {
  position: absolute; inset: -60px;
  border-radius: 50%;
  background: radial-gradient(ellipse at center,
    rgba(255,193,7,0.07) 0%,
    rgba(79,195,247,0.04) 40%,
    transparent 70%);
  animation: modalAura 3s ease-in-out infinite;
  pointer-events: none;
}
@keyframes modalAura {
  0%,100% { transform: scale(0.96); opacity: 0.7; }
  50%      { transform: scale(1.04); opacity: 1; }
}

.modal {
  position: relative;
  background: linear-gradient(
    145deg,
    rgba(12, 28, 80, 0.98) 0%,
    rgba(6, 16, 52, 0.99) 60%,
    rgba(10, 22, 68, 0.98) 100%
  );
  border: 1.5px solid rgba(255, 193, 7, 0.3);
  border-radius: 28px;
  padding: 30px 26px 24px;
  width: min(96vw, 740px);
  overflow: hidden;
  box-shadow:
    0 40px 100px rgba(0,0,0,0.9),
    0 0 0 1px rgba(255,255,255,0.04),
    inset 0 1px 0 rgba(255,255,255,0.08),
    0 0 60px rgba(255,193,7,0.06);
  animation: modalIn 0.5s cubic-bezier(0.34,1.4,0.64,1);
}
/* Animated top-edge light streak */
.modal::before {
  content: '';
  position: absolute; top: 0; left: -60%; right: -60%; height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255,193,7,0.6) 35%,
    rgba(255,255,255,0.9) 50%,
    rgba(255,193,7,0.6) 65%,
    transparent 100%);
  animation: topEdgeSheen 4s ease-in-out infinite;
}
@keyframes topEdgeSheen {
  0%,100% { opacity: 0.3; transform: scaleX(0.6); }
  50%      { opacity: 1;   transform: scaleX(1); }
}
/* Subtle corner glow */
.modal::after {
  content: '';
  position: absolute; top: -80px; right: -80px;
  width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,193,7,0.08) 0%, transparent 70%);
  pointer-events: none;
  animation: cornerGlow 3s ease-in-out 1s infinite;
}
@keyframes cornerGlow {
  0%,100% { opacity: 0.5; transform: scale(0.8); }
  50%      { opacity: 1;   transform: scale(1.2); }
}

@keyframes modalIn {
  0%  { transform: scale(0.8) translateY(60px); opacity: 0; }
  70% { transform: scale(1.02) translateY(-4px); opacity: 1; }
  100%{ transform: scale(1)   translateY(0);    opacity: 1; }
}

/* ── HEADER ── */
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 22px; position: relative;
}
.modal-title {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
  font-size: clamp(20px, 3vw, 28px);
  background: linear-gradient(135deg, #FFE082, #FFC107, #FF8F00);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  letter-spacing: 1.5px;
  filter: drop-shadow(0 0 12px rgba(255,193,7,0.4));
}
.modal-close {
  width: 38px; height: 38px; border-radius: 50%;
  border: 1.5px solid rgba(255,193,7,0.35);
  background: rgba(255,193,7,0.07);
  color: rgba(255,193,7,0.8);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
  font-family: sans-serif; line-height: 1; position: relative;
}
.modal-close::before {
  content: '';
  position: absolute; inset: -4px; border-radius: 50%;
  border: 1.5px solid rgba(255,193,7,0);
  transition: all 0.25s ease;
}
.modal-close:hover {
  background: rgba(255,193,7,0.18);
  border-color: rgba(255,193,7,0.7);
  color: #FFD700;
  transform: scale(1.15) rotate(90deg);
  box-shadow: 0 0 20px rgba(255,193,7,0.3);
}
.modal-close:hover::before {
  inset: -6px;
  border-color: rgba(255,193,7,0.25);
}

/* ── WINNERS TABLE ── */
.winners-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 7px;
}

/* Header */
.winners-table thead th {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
  font-size: clamp(11px, 1.6vw, 14px);
  letter-spacing: 2.5px; text-transform: uppercase;
  color: rgba(255,193,7,0.65);
  padding: 6px 14px 10px;
  text-align: left;
  border-bottom: 1px solid rgba(255,193,7,0.15);
}

/* ── BODY ROWS — glassmorphism cards ── */
.winners-table tbody tr {
  position: relative;
  background: rgba(255,255,255,0.035);
  cursor: pointer;
  transition:
    transform      0.32s cubic-bezier(0.34,1.28,0.64,1),
    box-shadow     0.32s ease,
    background     0.32s ease;
  animation: rowIn 0.45s cubic-bezier(0.34,1.2,0.64,1) both;
}

/* Staggered row entrance */
.winners-table tbody tr:nth-child(1) { animation-delay: 0.05s; }
.winners-table tbody tr:nth-child(2) { animation-delay: 0.12s; }
.winners-table tbody tr:nth-child(3) { animation-delay: 0.19s; }
.winners-table tbody tr:nth-child(4) { animation-delay: 0.26s; }
.winners-table tbody tr:nth-child(5) { animation-delay: 0.33s; }

@keyframes rowIn {
  0%  { opacity: 0; transform: translateY(20px) scale(0.97); }
  60% { opacity: 1; transform: translateY(-3px) scale(1.005); }
  100%{ opacity: 1; transform: translateY(0)   scale(1); }
}

/* Hover — subtle lift + left blue-gold accent bar */
.winners-table tbody tr:hover {
  background: linear-gradient(
    100deg,
    rgba(255,193,7,0.07) 0%,
    rgba(79,195,247,0.04) 50%,
    rgba(255,193,7,0.03) 100%
  );
  transform: translateY(-3px) scale(1.008);
  box-shadow:
    0 8px 32px rgba(0,0,0,0.35),
    0 2px 0 rgba(255,193,7,0.0),
    inset 3px 0 0 rgba(255,193,7,0.55),
    inset 0 1px 0 rgba(255,255,255,0.07),
    inset 0 -1px 0 rgba(0,0,0,0.1);
}
/* Left accent bar sweeps in */
.winners-table tbody tr td:first-child {
  position: relative;
}
.winners-table tbody tr td:first-child::before {
  content: '';
  position: absolute; left: 0; top: 8px; bottom: 8px;
  width: 0; border-radius: 2px;
  background: linear-gradient(180deg, #FFD700, #FF8F00);
  transition: width 0.28s ease;
  box-shadow: 0 0 10px rgba(255,193,7,0.6);
}
.winners-table tbody tr:hover td:first-child::before { width: 3px; }

/* ── WINNER-HIGHLIGHT ROW (1st on each page) ── */
.winners-table tbody tr.winner-highlight {
  background: linear-gradient(
    100deg,
    rgba(255,193,7,0.12) 0%,
    rgba(255,140,0,0.06) 60%,
    rgba(255,193,7,0.04) 100%
  );
  box-shadow:
    0 0 0 1px rgba(255,193,7,0.28),
    0 6px 24px rgba(255,193,7,0.1),
    inset 0 1px 0 rgba(255,193,7,0.15);
  animation: rowIn 0.45s cubic-bezier(0.34,1.2,0.64,1) 0.05s both,
             hlPulse 3s ease-in-out 0.8s infinite;
}
@keyframes hlPulse {
  0%,100% {
    box-shadow:
      0 0 0 1px rgba(255,193,7,0.25),
      0 6px 24px rgba(255,193,7,0.08),
      inset 0 1px 0 rgba(255,193,7,0.12);
  }
  50% {
    box-shadow:
      0 0 0 1.5px rgba(255,193,7,0.55),
      0 10px 36px rgba(255,193,7,0.22),
      inset 0 1px 0 rgba(255,255,255,0.12);
  }
}
.winners-table tbody tr.winner-highlight:hover {
  transform: translateY(-4px) scale(1.012);
  box-shadow:
    0 0 0 1.5px rgba(255,193,7,0.6),
    0 14px 44px rgba(255,193,7,0.25),
    inset 3px 0 0 #FFD700,
    inset 0 1px 0 rgba(255,255,255,0.1);
}

/* ── TD CELLS ── */
.winners-table tbody td {
  padding: 15px 14px;
  font-size: clamp(13px, 1.75vw, 16px);
  color: rgba(255,255,255,0.82);
  vertical-align: middle;
  border-top:    1px solid rgba(255,255,255,0.04);
  border-bottom: 1px solid rgba(0,0,0,0.12);
  transition: color 0.28s ease;
}
.winners-table tbody td:first-child {
  border-radius: 14px 0 0 14px;
  border-left: 1px solid rgba(255,255,255,0.04);
  overflow: hidden;
}
.winners-table tbody td:last-child {
  border-radius: 0 14px 14px 0;
  border-right: 1px solid rgba(255,255,255,0.04);
}
.winners-table tbody tr:hover td { color: rgba(255,255,255,0.95); }

/* Row number badge */
.row-num {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,193,7,0.1);
  border: 1.5px solid rgba(255,193,7,0.3);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 900;
  color: rgba(255,193,7,0.8);
  transition: all 0.28s ease;
}
.winners-table tbody tr:hover .row-num {
  background: rgba(255,193,7,0.2);
  border-color: rgba(255,193,7,0.7);
  color: #FFD700;
  box-shadow: 0 0 14px rgba(255,193,7,0.35);
  transform: scale(1.12);
}
.winner-highlight .row-num {
  background: linear-gradient(135deg, #FFC107, #FF8F00);
  border-color: #FFD700;
  color: #1a0800;
  box-shadow: 0 0 16px rgba(255,193,7,0.45);
}

/* Farmer name */
.winner-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(15px, 2.1vw, 19px);
  font-weight: 900; color: rgba(255,255,255,0.92);
  letter-spacing: 0.3px;
  transition: color 0.28s ease;
}
.winners-table tbody tr:hover .winner-name { color: #fff; }
.winner-highlight .winner-name { color: #FFE082; }
.winner-highlight:hover .winner-name { color: #fff; }

/* Other fields */
.winner-mobile {
  font-weight: 700; color: rgba(255,255,255,0.5);
  font-size: clamp(12px,1.55vw,14px); letter-spacing: 0.3px;
  font-family: 'Nunito', sans-serif;
  transition: color 0.28s ease;
}
.winner-district {
  font-weight: 700; color: rgba(255,255,255,0.5);
  font-size: clamp(12px,1.55vw,14px);
  font-family: 'Nunito', sans-serif;
  transition: color 0.28s ease;
}
.winner-state {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
  font-size: clamp(13px,1.75vw,16px); letter-spacing: 0.8px;
  color: rgba(255,193,7,0.7);
  transition: color 0.28s ease;
}
.winners-table tbody tr:hover .winner-mobile,
.winners-table tbody tr:hover .winner-district { color: rgba(255,255,255,0.75); }
.winners-table tbody tr:hover .winner-state { color: var(--gold-lt); }

/* ── PAGINATION ── */
.pagination {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 20px; gap: 12px;
}
.page-info {
  font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 900;
  color: rgba(255,255,255,0.3); letter-spacing: 2.5px; text-align: center; flex: 1;
}

/* Pagination buttons */
.page-btn {
  padding: 10px 26px; border-radius: 50px;
  border: 1.5px solid rgba(255,193,7,0.3);
  background: rgba(255,193,7,0.05);
  color: rgba(255,193,7,0.7);
  font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 900;
  letter-spacing: 1.5px; cursor: pointer;
  position: relative; overflow: hidden;
  transition:
    transform   0.28s cubic-bezier(0.34,1.56,0.64,1),
    box-shadow  0.28s ease,
    background  0.28s ease,
    border-color 0.28s ease,
    color       0.28s ease;
}
/* Sheen sweep on buttons */
.page-btn::before {
  content: '';
  position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
  background: linear-gradient(110deg, transparent, rgba(255,255,255,0.18), transparent);
  transition: left 0s;
}
.page-btn:hover:not(:disabled)::before {
  left: 160%; transition: left 0.45s ease;
}
.page-btn:hover:not(:disabled) {
  background: rgba(255,193,7,0.14);
  border-color: rgba(255,193,7,0.65);
  color: #FFD700;
  transform: translateY(-2px) scale(1.05);
  box-shadow:
    0 6px 24px rgba(255,193,7,0.2),
    0 0 0 1px rgba(255,193,7,0.15),
    inset 0 1px 0 rgba(255,255,255,0.1);
}
.page-btn:active:not(:disabled) { transform: scale(0.96); }
.page-btn:disabled { opacity: 0.2; cursor: not-allowed; }

/* ── CELEBRATION PARTICLES ── */
/* Confetti pieces */
.cel-p {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  animation: celFly var(--dur, 1.2s) ease-out var(--delay, 0s) both;
}
@keyframes celFly {
  0%   { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
  80%  { opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot, 360deg)) scale(0.2); opacity: 0; }
}

/* Spark streaks */
.cel-spark {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  width: 3px;
  border-radius: 2px;
  transform-origin: bottom center;
  animation: sparkShoot var(--dur, 0.7s) ease-out var(--delay, 0s) both;
}
@keyframes sparkShoot {
  0%   { transform: translate(0,0) scaleY(1) rotate(var(--ang,0deg)); opacity: 1; }
  100% { transform: translate(var(--dx),var(--dy)) scaleY(0.1) rotate(var(--ang,0deg)); opacity: 0; }
}

/* Ring shockwave */
.cel-ring {
  position: fixed;
  pointer-events: none;
  z-index: 9998;
  border-radius: 50%;
  border: 3px solid;
  animation: ringShock var(--dur,0.8s) ease-out var(--delay,0s) both;
}
@keyframes ringShock {
  0%   { transform: translate(-50%,-50%) scale(0); opacity: 0.9; }
  100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
}
</style>

<script>
/* ══════════════════════════════════════════
   PRIZE DATA
══════════════════════════════════════════ */
const GH = 'https://raw.githubusercontent.com/projectquicksilver/farmology-lucky-draw/main/';
const prizes = {
  1: {
    badge:   GH + '1st%20batch.png',
    product: GH + 'spray%20machine%201st%20prize.png',
    rank:    '🥇 1ST PRIZE',
    name:    'LARGE SPRAY MACHINE',
    sub:     '16L Battery-Powered',
    cRank:   '⭐ 1st Prize',
    cName:   'LARGE SPRAY<br>MACHINE',
    cSub:    '16L Battery-Powered Backpack',
    qty:     '🎁 × 1 Winner',
    csv:     'winners_1st.csv',
    wheel:   ['WIN!','Try Again','Lucky!','Not Yet','Almost!','Spin Again','Winner','Keep Going']
  },
  2: {
    badge:   GH + '2nd%20batch.png',
    product: GH + 'small%20spray%20machine%202nd%20prize.png',
    rank:    '🥈 2ND PRIZE',
    name:    '3 SMALL SPRAY MACHINES',
    sub:     '5L Manual Pressure Pump',
    cRank:   '🥈 2nd Prize',
    cName:   'SMALL SPRAY<br>MACHINES',
    cSub:    '5L Manual Pressure Pump',
    qty:     '🎁 × 3 Winners',
    csv:     'winners_2nd.csv',
    wheel:   ['WIN!','Try Again','Lucky!','Not Yet','Almost!','Spin Again','Winner','Keep Going']
  },
  3: {
    badge:   GH + '3rd%20batch.png',
    product: GH + 'led%20light%203rd%20prize.png',
    rank:    '🥉 3RD PRIZE',
    name:    '10 TORCH LIGHTS',
    sub:     'High-Power LED',
    cRank:   '🥉 3rd Prize',
    cName:   'TORCH<br>LIGHTS',
    cSub:    'High-Power LED Flashlight',
    qty:     '🎁 × 10 Winners',
    csv:     'winners_3rd.csv',
    wheel:   ['WIN!','Try Again','Lucky!','Not Yet','Almost!','Spin Again','Winner','Keep Going']
  }
};

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
const params = new URLSearchParams(location.search);
const prizeId = parseInt(params.get('prize')) || 1;
const prize = prizes[prizeId];

// Podium
document.getElementById('pod-badge').src   = prize.badge;
document.getElementById('pod-product').src = prize.product;
document.getElementById('pod-rank-label').textContent = prize.rank;
document.getElementById('pod-name').textContent = prize.name;
document.getElementById('pod-sub').textContent  = prize.sub;

// Card
document.getElementById('card-medal').src = prize.badge;
document.getElementById('card-img').src   = prize.product;
document.getElementById('card-rank-label').textContent = prize.cRank;
document.getElementById('card-name').innerHTML  = prize.cName;
document.getElementById('card-sub').textContent = prize.cSub;
document.getElementById('card-qty').textContent = prize.qty;

// Modal title
document.getElementById('modal-title').textContent = `🏆 ${prize.rank} Winners`;

/* ── Confetti + Stars ── */
(function(){
  const layer = document.getElementById('fx');
  const colors = ['#FF3B3B','#FFC107','#2196F3','#6FE7FF','#FFE082','#FF6B35','#fff'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div'); el.className='cf';
    const c=colors[i%colors.length],w=4+Math.random()*9,h=w*(Math.random()>.4?2.5:1);
    el.style.cssText=`left:${Math.random()*100}%;width:${w}px;height:${h}px;background:${c};border-radius:${Math.random()>.5?'50%':'2px'};animation-delay:${Math.random()*10}s;animation-duration:${7+Math.random()*8}s;`;
    layer.appendChild(el);
  }
  for(let i=0;i<20;i++){
    const s=document.createElement('div'); s.className='sp';
    const sz=3+Math.random()*9;
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*95}%;width:${sz}px;height:${sz}px;animation-delay:${Math.random()*3}s;animation-duration:${1.5+Math.random()*2.5}s;`;
    layer.appendChild(s);
  }
})();

/* ══════════════════════════════════════════
   CARD CLICK → SHOW WHEEL
══════════════════════════════════════════ */
document.getElementById('card-wrap').addEventListener('click', function() {
  this.style.display = 'none';
  document.getElementById('wheel-zone').classList.add('active');
  document.getElementById('div-label').textContent = '✦ Click Wheel to Spin ✦';
  initWheel();
});

/* ══════════════════════════════════════════
   WHEEL
══════════════════════════════════════════ */
let wheelSpinning = false;
let wheelAngle = 0;
let wheelDrawn = false;

/* ─────────────────────────────────────────
   WHEEL  –  8 vivid flat-colour segments
   + emoji icon on each, white SPIN hub
───────────────────────────────────────── */
const SEGS = [
  { color:'#E63950', emoji:'🏆' },
  { color:'#F5A623', emoji:'⭐' },
  { color:'#2196F3', emoji:'🎁' },
  { color:'#11B87F', emoji:'🎯' },
  { color:'#9B27AF', emoji:'💎' },
  { color:'#FF6B35', emoji:'🌟' },
  { color:'#1565C0', emoji:'🎊' },
  { color:'#E91E8C', emoji:'🏅' },
];
const NUM_SEGS = SEGS.length;

/* Pre-load emoji by drawing them to an offscreen canvas */
const EMOJI_SIZE = 40;
let emojiImages = [];

function preloadEmojis(callback) {
  emojiImages = [];
  let done = 0;
  SEGS.forEach((seg, i) => {
    const off = document.createElement('canvas');
    off.width = off.height = EMOJI_SIZE;
    const c = off.getContext('2d');
    c.font = (EMOJI_SIZE * 0.78) + 'px serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(seg.emoji, EMOJI_SIZE/2, EMOJI_SIZE/2);
    const img = new Image();
    img.onload = () => { emojiImages[i] = img; done++; if(done===SEGS.length) callback(); };
    img.src = off.toDataURL();
  });
}

function initWheel() {
  if (wheelDrawn) return;
  wheelDrawn = true;
  preloadEmojis(() => {
    const canvas = document.getElementById('wheel-canvas');
    /* Use a fixed 300px canvas — simple and reliable */
    const SIZE = Math.min(document.querySelector('.wheel-container').offsetWidth, 300);
    canvas.width  = SIZE;
    canvas.height = SIZE;
    drawWheel(canvas, wheelAngle);
  });
  document.getElementById('wheel-container').addEventListener('click', spinWheel);
}

function drawWheel(canvas, angle) {
  const ctx  = canvas.getContext('2d');
  const S    = canvas.width;
  const cx   = S / 2, cy = S / 2;
  const R    = S / 2 - 8;          /* wheel radius */
  const ARC  = (Math.PI * 2) / NUM_SEGS;

  ctx.clearRect(0, 0, S, S);

  /* ── 1. Outer glow ring ── */
  ctx.save();
  ctx.shadowColor = 'rgba(255,200,0,0.7)';
  ctx.shadowBlur  = 22;
  ctx.beginPath(); ctx.arc(cx, cy, R + 6, 0, Math.PI*2);
  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth   = 5;
  ctx.stroke();
  ctx.restore();

  /* ── 2. Coloured segments ── */
  for (let i = 0; i < NUM_SEGS; i++) {
    const start = angle + i * ARC - Math.PI / 2;
    const end   = start + ARC;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, start, end);
    ctx.closePath();
    ctx.fillStyle = SEGS[i].color;
    ctx.fill();

    /* thin white divider line */
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(start) * R, cy + Math.sin(start) * R);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth   = 2.5;
    ctx.stroke();
  }

  /* ── 3. Outer border ring ── */
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth   = 4;
  ctx.stroke();

  /* ── 4. Emoji icons on each segment ── */
  const iconDist = R * 0.62;
  const iconSize = R * 0.28;
  for (let i = 0; i < NUM_SEGS; i++) {
    const midA = angle + i * ARC - Math.PI/2 + ARC/2;
    const ix   = cx + Math.cos(midA) * iconDist;
    const iy   = cy + Math.sin(midA) * iconDist;

    if (emojiImages[i]) {
      ctx.drawImage(emojiImages[i], ix - iconSize/2, iy - iconSize/2, iconSize, iconSize);
    } else {
      /* fallback plain text emoji if image not ready */
      ctx.save();
      ctx.font = (iconSize * 0.85) + 'px serif';
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(SEGS[i].emoji, ix, iy);
      ctx.restore();
    }
  }

  /* ── 5. White center SPIN hub ── */
  const hubR = R * 0.20;

  /* shadow behind hub */
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur  = 12;
  ctx.beginPath(); ctx.arc(cx, cy, hubR, 0, Math.PI*2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.restore();

  /* gold border */
  ctx.beginPath(); ctx.arc(cx, cy, hubR, 0, Math.PI*2);
  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth   = 3;
  ctx.stroke();

  /* SPIN text */
  ctx.save();
  ctx.font         = `900 ${Math.round(hubR * 0.52)}px 'Barlow Condensed', sans-serif`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle    = '#333';
  ctx.fillText('SPIN', cx, cy);
  ctx.restore();
}

function spinWheel() {
  if (wheelSpinning) return;
  wheelSpinning = true;
  document.getElementById('wheel-label').textContent = '✦ SPINNING... ✦';

  const canvas = document.getElementById('wheel-canvas');
  const totalRotation = (Math.PI*2) * (5 + Math.random()*3);
  const duration = 4000;
  const start = performance.now();
  const startAngle = wheelAngle;

  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  function animate(now) {
    const elapsed = Math.min(now - start, duration);
    const t = elapsed / duration;
    wheelAngle = startAngle + totalRotation * easeOut(t);
    drawWheel(canvas, wheelAngle);
    if (elapsed < duration) {
      requestAnimationFrame(animate);
    } else {
      wheelSpinning = false;
      onSpinEnd();
    }
  }
  requestAnimationFrame(animate);
}

function onSpinEnd() {
  document.getElementById('wheel-label').textContent = '🎉 SPIN COMPLETE!';

  const wc   = document.getElementById('wheel-container');
  const rect = wc.getBoundingClientRect();
  const ox   = rect.left + rect.width  / 2;
  const oy   = rect.top  + rect.height / 2;

  const COLS = ['#FFD700','#FF8F00','#FFE082','#FFC107','#FF3B3B','#ffffff','#6FE7FF','#FF6B35','#E91E8C','#11B87F','#9B27AF'];

  /* ── 1. RING SHOCKWAVES (3 expanding rings) ── */
  [0, 120, 240].forEach((delay, ri) => {
    const ring = document.createElement('div');
    ring.className = 'cel-ring';
    const size = 60 + ri * 30;
    ring.style.cssText = `
      left:${ox}px; top:${oy}px;
      width:${size}px; height:${size}px;
      border-color:${['#FFD700','#FF8F00','#ffffff'][ri]};
      --delay:${delay}ms; --dur:0.9s;
    `;
    document.body.appendChild(ring);
    setTimeout(() => ring.remove(), 1200 + delay);
  });

  /* ── 2. SPARK STREAKS (radial lines shooting out) ── */
  const SPARK_COUNT = 24;
  for (let i = 0; i < SPARK_COUNT; i++) {
    const spark = document.createElement('div');
    spark.className = 'cel-spark';
    const angle  = (i / SPARK_COUNT) * Math.PI * 2;
    const dist   = 80 + Math.random() * 140;
    const len    = 12 + Math.random() * 28;
    const delay  = Math.random() * 180;
    spark.style.cssText = `
      left:${ox}px; top:${oy}px;
      height:${len}px;
      background:${COLS[i % COLS.length]};
      --dx:${Math.cos(angle)*dist}px;
      --dy:${Math.sin(angle)*dist}px;
      --ang:${(angle * 180/Math.PI) + 90}deg;
      --dur:${0.5 + Math.random() * 0.5}s;
      --delay:${delay}ms;
    `;
    document.body.appendChild(spark);
    setTimeout(() => spark.remove(), 1000 + delay);
  }

  /* ── 3. CONFETTI BURST (round + rect pieces flying out) ── */
  const CONF_COUNT = 60;
  for (let i = 0; i < CONF_COUNT; i++) {
    const p     = document.createElement('div');
    p.className = 'cel-p';
    const angle  = (i / CONF_COUNT) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
    const dist   = 100 + Math.random() * 220;
    const sz     = 5 + Math.random() * 10;
    const isRect = Math.random() > 0.45;
    const delay  = Math.random() * 250;
    const rot    = (Math.random() - 0.5) * 720;
    p.style.cssText = `
      left:${ox - sz/2}px; top:${oy - sz/2}px;
      width:${sz}px; height:${isRect ? sz * 2.5 : sz}px;
      border-radius:${isRect ? '2px' : '50%'};
      background:${COLS[i % COLS.length]};
      --dx:${Math.cos(angle)*dist}px;
      --dy:${Math.sin(angle)*dist}px;
      --rot:${rot}deg;
      --dur:${0.8 + Math.random() * 0.7}s;
      --delay:${delay}ms;
    `;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1600 + delay);
  }

  /* ── 4. SECONDARY CONFETTI WAVE (falls from top of screen) ── */
  setTimeout(() => {
    for (let i = 0; i < 40; i++) {
      const p     = document.createElement('div');
      p.className = 'cel-p';
      const sx    = Math.random() * window.innerWidth;
      const dist  = window.innerHeight * 0.6 + Math.random() * window.innerHeight * 0.3;
      const sz    = 5 + Math.random() * 9;
      const delay = Math.random() * 600;
      const rot   = (Math.random() - 0.5) * 540;
      p.style.cssText = `
        left:${sx}px; top:${-10}px;
        width:${sz}px; height:${Math.random()>0.5 ? sz*2.5 : sz}px;
        border-radius:${Math.random()>0.5 ? '50%' : '2px'};
        background:${COLS[Math.floor(Math.random()*COLS.length)]};
        --dx:${(Math.random()-0.5)*120}px;
        --dy:${dist}px;
        --rot:${rot}deg;
        --dur:${1.2 + Math.random() * 0.8}s;
        --delay:${delay}ms;
      `;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 2200 + delay);
    }
  }, 300);

  /* ── 5. Fade wheel → show centered reveal button ── */
  setTimeout(() => {
    const wz = document.getElementById('wheel-zone');
    wz.style.transition = 'opacity 0.6s';
    wz.style.opacity    = '0';
    setTimeout(() => {
      wz.classList.remove('active');
      wz.style.opacity    = '';
      wz.style.transition = '';
      document.getElementById('reveal-btn-wrap').classList.add('show');
      document.getElementById('div-label').textContent = '✦ Winners Revealed! ✦';
    }, 600);
  }, 900);
}

/* ══════════════════════════════════════════
   CSV LOADING & MODAL
══════════════════════════════════════════ */
const PAGE_SIZE = 5;
let allWinners = [];
let currentPage = 1;

// Load CSV when modal opens
async function openModal() {
  try {
    const response = await fetch(prize.csv);
    const text = await response.text();
    allWinners = parseCSV(text);
  } catch(e) {
    // Fallback demo data if CSV not found
    allWinners = getDemoWinners();
  }
  currentPage = 1;
  renderPage();
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  // Skip header line
  return lines.slice(1).map(line => {
    // Handle quoted fields
    const cols = line.match(/(".*?"|[^,]+)(?=,|$)/g) || line.split(',');
    return {
      name:     (cols[0]||'').replace(/"/g,'').trim(),
      mobile:   (cols[1]||'').replace(/"/g,'').trim(),
      district: (cols[2]||'').replace(/"/g,'').trim(),
      state:    (cols[3]||'').replace(/"/g,'').trim()
    };
  }).filter(r => r.name);
}

function getDemoWinners() {
  return [
    {name:'Ramesh Kumar',    mobile:'9876543210', district:'Nashik',       state:'Maharashtra'},
    {name:'Suresh Patel',    mobile:'8765432109', district:'Ahmedabad',    state:'Gujarat'},
    {name:'Priya Sharma',    mobile:'7654321098', district:'Jaipur',       state:'Rajasthan'},
    {name:'Mohan Reddy',     mobile:'6543210987', district:'Hyderabad',    state:'Telangana'},
    {name:'Anita Devi',      mobile:'9988776655', district:'Lucknow',      state:'Uttar Pradesh'},
    {name:'Ravi Shankar',    mobile:'8877665544', district:'Patna',        state:'Bihar'},
    {name:'Sunita Yadav',    mobile:'7766554433', district:'Bhopal',       state:'Madhya Pradesh'},
    {name:'Ajay Singh',      mobile:'6655443322', district:'Chandigarh',   state:'Punjab'},
    {name:'Meena Kumari',    mobile:'9543216789', district:'Mysuru',       state:'Karnataka'},
    {name:'Dinesh Gowda',    mobile:'8432107698', district:'Pune',         state:'Maharashtra'}
  ];
}

function renderPage() {
  const start = (currentPage-1)*PAGE_SIZE;
  const pageData = allWinners.slice(start, start+PAGE_SIZE);
  const totalPages = Math.ceil(allWinners.length/PAGE_SIZE) || 1;

  const tbody = document.getElementById('winners-tbody');
  tbody.innerHTML = '';

  pageData.forEach((w, i) => {
    const isFirst = (i === 0); // highlight top row of each page
    const tr = document.createElement('tr');
    if (isFirst) tr.classList.add('winner-highlight');
    tr.innerHTML = `
      <td><div class="row-num">${start+i+1}</div></td>
      <td><div class="winner-name">${isFirst ? '🏆 ' : ''}${w.name}</div></td>
      <td><div class="winner-mobile">${w.mobile}</div></td>
      <td><div class="winner-district">${w.district}</div></td>
      <td><div class="winner-state">${w.state}</div></td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
  document.getElementById('prev-btn').disabled = currentPage === 1;
  document.getElementById('next-btn').disabled = currentPage === totalPages;
}

function changePage(dir) {
  const totalPages = Math.ceil(allWinners.length/PAGE_SIZE) || 1;
  currentPage = Math.max(1, Math.min(totalPages, currentPage+dir));
  renderPage();
}

// Close modal on overlay click
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
